name: "Morning Briefing"
schedule: "0 7 * * 1-5"

prompt: |
  Morning Briefing. Scan email inbox for anything urgent, especially recruiter messages.
  Check the job tracker for follow-ups due today. Review yesterday's unfinished tasks.
  Send Enrique a single WhatsApp message with his prioritized day.
  Keep it under 10 lines. Don't be chatty. Approval required before sending.
